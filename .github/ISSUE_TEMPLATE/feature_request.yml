name: Идея
description: Предложить фичу или улучшение
labels: [enhancement]
body:
  - type: input
    id: module
    attributes:
      label: К какому модулю относится (или «бот в целом»)
      placeholder: "network / бот в целом"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Что предлагаешь и зачем
      description: Что должно получиться и какую задачу это решает
    validations:
      required: true
